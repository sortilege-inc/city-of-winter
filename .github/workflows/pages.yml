name: Deploy web/ to GitHub Pages

# The site lives in web/, not at the repo root, so it is published as an Actions
# artifact rather than from a branch folder. web/data/cow.json is committed, so
# there is nothing to build — the corpus generator needs the source PDFs, which
# are deliberately not in this repository.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Inline <script type="module"> blocks fail silently in a browser: a stray
      # paren gives a blank page and an empty console. Parse every module and
      # every inline block before anything ships.
      - name: JavaScript syntax
        run: python3 web/check_js.py

      - name: Data feed is present and parses
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('web/data/cow.json'))
          need = ['decks', 'cards', 'riverlands', 'city', 'transitDistance', 'procedures']
          missing = [k for k in need if not d.get(k)]
          if missing:
              sys.exit(f'feed is missing: {missing}')
          if len(d['cards']) != 249:
              sys.exit(f"expected 249 Tradition Cards, feed has {len(d['cards'])}")
          print(f"feed ok — {len(d['cards'])} cards, "
                f"{len(d['riverlands']) + len(d['city']) + 1} locations")
          PY

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
