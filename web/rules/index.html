<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rules · City of Winter</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../winter.css">
<style>
  .layout{ display:grid; gap:1.6rem; grid-template-columns:minmax(200px,250px) minmax(0,1fr); align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } .toc{ position:static !important; max-height:none !important; } .toc .items{ display:none; } }
  .toc{ position:sticky; top:64px; max-height:calc(100vh - 84px); overflow-y:auto; padding:0.8rem 0.9rem; }
  .toc input{ width:100%; margin-bottom:0.7rem; }
  .toc a{ display:block; text-decoration:none; color:var(--chalk-dim); }
  .toc a:hover{ color:var(--ice); }
  .toc .sec{ font-family:var(--caps); font-variant:small-caps; letter-spacing:0.08em; font-size:1rem; color:var(--chalk-2); margin-top:0.55rem; }
  .toc .sec.on{ color:var(--gold-lit); }
  .toc .items a{ font-size:0.9rem; padding:0.05rem 0 0.05rem 0.7rem; border-left:1px solid var(--edge-soft); }
  .toc .items a.on{ color:var(--ice); border-left-color:var(--ice-deep); }
  .rsec{ scroll-margin-top:70px; }
  .rsec > h2{ font-size:2rem; margin:2.2rem 0 0.4rem; border-bottom:1px solid var(--edge-soft); padding-bottom:0.3rem; }
  .rsec:first-child > h2{ margin-top:0; }
  .item{ scroll-margin-top:70px; background:var(--night-2); border:1px solid var(--edge); border-radius:7px; padding:0.9rem 1.1rem 0.8rem; margin:0.9rem 0; }
  .item > h3{ margin:0 0 0.3rem; color:var(--chalk); font-family:var(--disp); font-variant:normal; letter-spacing:0.01em; font-size:1.3rem; }
  .item .kind{ font-family:var(--caps); font-variant:small-caps; letter-spacing:0.12em; font-size:0.8rem; color:var(--gold); }
  .item.optional{ border-color:rgba(232,145,46,0.4); }
  .item .stepblock > h4{ margin:0 0 0.2rem; min-height:1.6rem; color:var(--chalk); }
  .item .substeps{ margin-top:0.4rem; }
  .item .substeps h5{ font-family:var(--caps); font-variant:small-caps; letter-spacing:0.08em; font-size:1rem; color:var(--ice); margin:0.6rem 0 0.1rem; }
  .opts{ display:grid; gap:0.6rem; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); margin:0.4rem 0; }
  .opt{ background:rgba(0,0,0,0.2); border:1px solid var(--edge-soft); border-radius:6px; padding:0.55rem 0.8rem; }
  .opt b{ display:block; color:var(--sand); font-weight:500; margin-bottom:0.1rem; }
  .opt .rtext.instr{ margin:0; font-size:0.97rem; }
  .rsec > .sidebar{ scroll-margin-top:70px; margin:0.9rem 0; }
  .sidebar{ border-left:3px solid var(--gold); background:rgba(209,161,60,0.06); border-radius:0 6px 6px 0; padding:0.55rem 0.9rem; margin:0.7rem 0; }
  .sidebar .lbl{ font-family:var(--caps); font-variant:small-caps; letter-spacing:0.1em; color:var(--gold-lit); font-size:0.92rem; }
  .sidebar .rtext.instr{ margin:0.2rem 0 0; font-size:0.97rem; }
  .item .sidebar{ margin:0.8rem 0 0.2rem; }
  .fatetable td:first-child{ font-family:var(--disp); color:var(--gold-lit); width:3.2rem; }
  .bondlists{ display:grid; gap:0.7rem; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .bondlists .bl{ background:var(--night-3); border:1px solid var(--edge-soft); border-radius:6px; padding:0.5rem 0.8rem; }
  .bondlists .bl h4{ margin:0 0 0.2rem; color:var(--ice); }
  .bondlists .bl p{ margin:0; font-size:0.96rem; color:var(--chalk-2); }
  .bondlists .bl .open{ font-style:italic; color:var(--chalk-dim); }
  .components dt{ font-family:var(--caps); font-variant:small-caps; letter-spacing:0.08em; color:var(--ice); }
  .components dd{ margin:0 0 0.5rem; color:var(--chalk-2); }
  .lore h2{ font-size:1.25rem; margin:1rem 0 0.2rem; }
  .lore h3{ margin:0.8rem 0 0.2rem; }
  .lore ul{ padding-left:1.1rem; }
  .lore p, .lore li{ color:var(--chalk-2); }
  .hidden{ display:none !important; }
  .noresults{ padding:2rem 0; text-align:center; }
  mark{ background:rgba(237,199,106,0.35); color:inherit; border-radius:2px; }
</style>
</head>
<body>
<div class="wrap wide">
  <header class="masthead" style="padding-bottom:0.4rem">
    <div class="eyebrow">The book’s own words</div>
    <h1>Rules</h1>
    <p class="sub">Every procedure, rule and sidebar of City of Winter, set out the way the book is — ready to look up at the table.</p>
  </header>
  <div class="flourish"></div>
  <div class="layout">
    <nav class="toc panel" id="toc" aria-label="Contents"></nav>
    <main id="root"></main>
  </div>
</div>

<script type="module">
import { loadData } from '../app/data.js';
import { $, $$, el, add, mountNav, mountFooter, miniMarkdown, ruleText, xcard } from '../app/ui.js';

mountNav('rules');
const data = await loadData();
const root = $('#root'), toc = $('#toc');

const instr = (t) => ruleText(t, { cls: 'instr' });
const teach = (t) => ruleText(t, { cls: 'teach' });
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
/** Guidance labels are slugs; show them as words. */
const labelOf = (g) => { const t = g.label.replace(/-/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1); };

/* ---- the book's chapters. Pages are used only to put things in order; they
   are never shown — play happens here, not in the PDF. */
const CHAPTERS = ['Introduction', 'First Session Setup', 'Playing the Game', 'Campaign Rules', 'City Rules', 'Design Notes', 'Reference'];
const pageOf = new Map(data.sections.map((s) => [s.title, s.page]));
const starts = CHAPTERS.map((c) => pageOf.get(c));
const chapterFor = (page) => {
  let i = 0;
  for (let k = 0; k < starts.length; k++) if (page >= starts[k]) i = k;
  return CHAPTERS[i];
};

/* ---- items: { chapter, page, name, kind, node } */
const items = [];
const itemEl = (name, kind, ...kids) => el('article', { class: `item ${kind === 'Optional rule' ? 'optional' : ''}`.trim(), id: slug(name) },
  kind ? el('div', { class: 'kind', text: kind }) : null, el('h3', { text: name }), ...kids);
function push(chapter, page, name, kind, node) { items.push({ chapter, page, name, kind, node }); }

function stepNode(s) {
  return el('section', { class: 'stepblock' },
    el('h4', {}, el('span', { class: 'n', text: s.n }), s.name),
    s.instruction ? instr(s.instruction) : null,
    s.teaching ? teach(s.teaching) : null,
    s.followUp ? instr(s.followUp) : null,
    s.teachingTwo ? teach(s.teachingTwo) : null,
    s.options ? el('div', { class: 'opts' }, s.options.map((o) => el('div', { class: 'opt' }, el('b', { text: o.name }), instr(o.instruction)))) : null,
    s.substeps ? el('div', { class: 'substeps' }, s.substeps.map((ss) => el('div', {},
      el('h5', { text: ss.name }), ss.instruction ? instr(ss.instruction) : null, ss.teaching ? teach(ss.teaching) : null,
      /x-card/i.test(ss.name) ? el('button', { class: 'tiny', text: '✕ The X-Card', onclick: xcard }) : null))) : null);
}

for (const p of data.procedures) {
  push(p.phase === 'Design Notes' ? 'Design Notes' : chapterFor(p.page), p.page, p.name, 'Procedure',
    itemEl(p.name, 'Procedure', p.instruction ? instr(p.instruction) : null, p.steps.map(stepNode),
      p.name === 'Ask Fate' ? el('table', { class: 'fatetable' }, el('tbody', {}, data.askFate.map((o) =>
        el('tr', {}, el('td', { text: o.roll }), el('td', {}, el('b', { text: o.outcome }), el('div', { class: 'small muted', text: o.definition })))))) : null));
}
for (const r of data.rules) push(chapterFor(r.page), r.page, r.name, 'Rule', itemEl(r.name, 'Rule', instr(r.text)));
push('City Rules', pageOf.get('City Marks'), 'City Marks', 'Rule', itemEl('City Marks', 'Rule', instr(data.concept('City Marks'))));
for (const o of data.optionalRules) {
  push('Design Notes', o.page, o.name, 'Optional rule', itemEl(o.name, 'Optional rule', teach(o.optionalText), instr(o.text),
    o.name === 'Solo Play' ? data.soloModules.map((m) => el('section', { class: 'stepblock' }, el('h4', {}, el('span', { class: 'n', text: '✎' }), m.name), instr(m.text))) : null));
}

// The book's essays
const lore = (t) => el('div', { class: 'lore', html: miniMarkdown(data.loreByTitle(t).markdown.replace(/^# .*\n/, '')) });
push('Introduction', pageOf.get('What This Is'), 'What This Is', '', itemEl('What This Is', '', lore('What This Is')));
push('Introduction', pageOf.get('Components'), 'Components', '', itemEl('Components', '',
  el('dl', { class: 'components' }, ['River Scroll', 'City Map', 'Tradition Deck', 'Token', 'Die', 'X-Card', 'Wandering Borough Card', 'Notecard', 'Writing Utensils']
    .map((n) => [el('dt', { text: n }), el('dd', {}, data.concept(n))]))));
push('Playing the Game', pageOf.get('Scene Advice'), 'Scene Advice', 'Advice', itemEl('Scene Advice', 'Advice', lore('Scene Advice')));
push('Reference', pageOf.get('Bonds'), 'Bonds', 'Reference', itemEl('Bonds', 'Reference',
  instr(data.concept('Bond')),
  el('div', { class: 'bondlists' }, data.bondLists.map((b) => el('div', { class: 'bl' },
    el('h4', { text: b.kind === 'Bonds' ? b.tier : `${b.kind}${b.kind === 'City Bonds' ? ` · ${b.tier}` : ''}` }),
    el('p', {}, b.prompts.join(', '), ' ', el('span', { class: 'open', text: b.openPrompt })))))));
push('Reference', 999, 'Credits', 'Reference', itemEl('Credits', 'Reference', lore('Credits')));

// Sidebars sit with the rule they concern; otherwise in their chapter. Two
// come from the Atlas, not the rulebook, and are placed by what they are about.
const ATLAS_HOST = { 'moving-character-tokens-in-the-city': 'Travel' };
for (const g of data.guidance) {
  const side = el('aside', { class: 'sidebar' }, el('div', { class: 'lbl', text: labelOf(g) }), instr(g.text));
  const host = items.find((it) => it.name === ATLAS_HOST[g.label])
    || items.find((it) => (g.concerns || []).includes(it.name) && it.kind !== '');
  if (host) add(host.node, side);
  else { side.id = slug(g.label); push(chapterFor(g.page), g.page, labelOf(g), 'Sidebar', side); }
}

/* ---- lay it out */
const chapters = CHAPTERS.map((c) => {
  const its = items.filter((i) => i.chapter === c).sort((a, b) => a.page - b.page);
  return { c, its, sec: el('section', { class: 'rsec', id: slug(c) }, el('h2', { text: c }), its.map((i) => i.node)) };
}).filter((x) => x.its.length);
add(root, chapters.map((x) => x.sec), el('p', { class: 'noresults muted hidden', text: 'Nothing in the rules matches that.' }));

/* ---- contents, with a filter */
const q = el('input', { type: 'search', placeholder: 'Find a rule…', 'aria-label': 'Find a rule' });
add(toc, q, chapters.map((x) => el('div', { class: 'tocsec', dataset: { sec: slug(x.c) } },
  el('a', { class: 'sec', href: '#' + slug(x.c), text: x.c }),
  el('div', { class: 'items' }, x.its.map((i) => el('a', { href: '#' + i.node.id, dataset: { item: i.node.id }, text: i.name }))))));

q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase();
  let any = false;
  for (const x of chapters) {
    let secAny = false;
    for (const i of x.its) {
      const hit = !t || i.node.textContent.toLowerCase().includes(t);
      i.node.classList.toggle('hidden', !hit);
      toc.querySelector(`[data-item="${i.node.id}"]`)?.classList.toggle('hidden', !hit);
      secAny ||= hit;
    }
    x.sec.classList.toggle('hidden', !secAny);
    toc.querySelector(`[data-sec="${slug(x.c)}"]`)?.classList.toggle('hidden', !secAny);
    any ||= secAny;
  }
  $('.noresults').classList.toggle('hidden', any);
});

// highlight where we are
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    $$('.toc a.on').forEach((a) => a.classList.remove('on'));
    toc.querySelector(`[data-item="${e.target.id}"]`)?.classList.add('on');
    const sec = e.target.closest('.rsec');
    if (sec) toc.querySelector(`[data-sec="${sec.id}"] > .sec`)?.classList.add('on');
  }
}, { rootMargin: '-80px 0px -70% 0px' });
items.forEach((i) => io.observe(i.node));

mountFooter('City of Winter is © 2022 Heart of the Deernicorn. This is an unofficial play aid.');
</script>
</body>
</html>
