<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas · City of Winter</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../winter.css">
<style>
  .loc{
    border:1px solid var(--edge); border-radius:8px; padding:0.9rem 1.05rem 1rem;
    background:linear-gradient(155deg, rgba(76,106,128,0.3), rgba(18,18,26,0.96) 62%);
  }
  .loc[data-region="City"]{ background:linear-gradient(155deg, rgba(193,112,60,0.26), rgba(111,21,18,0.14) 45%, rgba(18,18,26,0.96) 75%); }
  .loc.borough{ background:linear-gradient(155deg, rgba(232,72,155,0.24), rgba(209,161,60,0.1) 45%, rgba(18,18,26,0.96) 75%); }
  .loc h3{ margin:0 0 0.35rem; color:var(--chalk); font-family:var(--disp); font-variant:normal; letter-spacing:0.01em; font-size:1.3rem; }
  .loc .icons{ display:flex; flex-wrap:wrap; gap:0.25rem; color:var(--ice); }
  .loc .icons > span{ display:inline-flex; align-items:center; gap:0.15rem; font-family:var(--caps); font-variant:small-caps; letter-spacing:0.06em;
    font-size:0.86rem; padding:0 0.5rem; border-radius:99px; background:rgba(0,0,0,0.3); border:1px solid var(--edge-soft); }
  .loc[data-region="City"] .icons{ color:var(--sand); }
  .loc .icons .small{ font-size:inherit; }
  .loc .scenelist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:0.3rem; margin-top:0.65rem; }
  .loc .scenelist span{
    font-size:0.93rem; line-height:1.25; color:var(--chalk-2);
    background:rgba(10,10,12,0.5); border:1px solid var(--edge-soft); border-radius:5px; padding:0.3rem 0.5rem;
  }
  .loc .meta{ margin:0.45rem 0 0; font-size:0.9rem; color:var(--chalk-dim); }
  .loc .meta b{ font-weight:500; color:var(--chalk-2); }
  .loc .entr{ font-style:italic; }
  .lines .line{ margin-bottom:0.5rem; }
  .lines .line b{ color:var(--sand); }
  .dist td:first-child{ color:var(--chalk-2); white-space:nowrap; }
  .dist td.far{ color:var(--chalk-faint); }
  .dist td.near{ color:var(--amber); }
  .dist th{ font-size:0.72rem; writing-mode:vertical-rl; transform:rotate(200grad); height:8.5em; padding:0; }
  .dist td, .dist th{ border:1px solid var(--edge-soft); text-align:center; }
  .dist tr.derivedrow{ border-top:2px solid var(--magenta); }
  .dist tr.derivedrow td:first-child{ color:var(--pink); }
  .dist td.derived{ background:rgba(232,72,155,0.10); font-style:italic; }
</style>
</head>
<body>
<div class="wrap wide">
  <header class="masthead" style="padding-bottom:0.4rem">
    <div class="eyebrow">The River Scroll &amp; the City Map</div>
    <h1>Atlas</h1>
    <p class="sub">A map of connected Locations we unroll as we migrate from the Riverlands on the left, to the City of Winter at the far end of the scroll.</p>
  </header>
  <div class="flourish"></div>
  <div id="root"></div>
</div>

<script type="module">
import { loadData } from '../app/data.js';
import { $, el, mountNav, mountFooter, shapeIcon, ruleText } from '../app/ui.js';
const instr = (t) => ruleText(t, { cls: 'instr' });

mountNav('atlas');
const data = await loadData();
const root = $('#root');

function icons(loc) {
  return el('span', { class: 'icons' }, loc.traditions.map((t) => {
    if (t.startsWith('ANY:')) {
      const shape = t.slice(4);
      return el('span', { title: `blank ${shape}: any of ${data.shapeFamilies[shape].join(', ')}` },
        shapeIcon(shape), el('span', { class: 'small muted', text: `any ${shape} ` }));
    }
    const k = data.byDeck.get(t);
    return el('span', { title: t }, shapeIcon(k?.shape), el('span', { class: 'small', text: t + ' ' }));
  }));
}

function locCard(loc) {
  return el('div', { class: `loc ${loc === data.wanderingBorough ? 'borough' : ''}`.trim(), dataset: { region: loc.region }, id: 'loc-' + encodeURIComponent(loc.name) },
    el('h3', { text: loc.name }),
    el('div', {}, icons(loc)),
    loc.route ? el('p', { class: 'meta' }, el('b', { text: 'Route ' }), `by ${loc.route}`) : null,
    loc.connects && loc.connects.length
      ? el('p', { class: 'meta' }, el('b', { text: 'Connects to ' }), loc.connects.join(' · '))
      : null,
    loc.entrances && loc.entrances.length
      ? el('div', { class: 'meta' }, loc.entrances.map((e) => el('div', { class: 'entr', text: `${e.text} → ${e.target}` })))
      : null,
    loc.scenes.length
      ? el('div', { class: 'scenelist' }, loc.scenes.map((s) => el('span', { text: s })))
      : null);
}

root.append(
  el('h2', { text: 'The Riverlands' }),
  instr(data.guidanceText('by-ship-or-by-caravan')),
  el('div', { class: 'grid' }, data.riverlands.map(locCard)),

  el('div', { class: 'flourish' }),
  el('h2', { text: 'The City of Winter' }),
  instr(data.rule('Witnessing in the City')),
  instr(data.rule('Blank Tradition Icons')),
  el('div', { class: 'grid' }, data.city.map(locCard)),

  el('div', { class: 'flourish' }),
  el('h2', { text: 'The Wandering Borough' }),
  instr(data.rule('The Wandering Borough')),
  el('div', { class: 'grid' }, locCard(data.wanderingBorough)),

  el('div', { class: 'flourish' }),
  el('h2', { text: 'Transit Lines & Stations' }),
  instr(data.rule('Transit Lines & Stations')),
  instr(data.rule('Travel').split(/\n\s*\n/)[1]),
  el('div', { class: 'panel lines' }, data.transitLines.map((t) =>
    el('div', { class: 'line' },
      el('b', { text: t.name }),
      t.die ? el('span', { class: 'tag spire', text: `Borough die ${t.die}` }) : el('span', { class: 'tag', text: 'not on the Borough table' }),
      el('div', { class: 'small muted', text: t.stations.join('  ·  ') })))),
);

// --- the printed transit distance table -------------------------------------
const order = data.transitDistance.order;
const derived = data.transitDistance.derived || { rows: {} };
const cell = (v, extra = '') => el('td', {
  class: `${v === '7+' ? 'far' : v === '1' ? 'near' : ''} ${extra}`.trim(),
  text: v === '-' ? '' : v,
});
const tbl = el('table', { class: 'dist' },
  el('thead', {}, el('tr', {}, el('th', {}), order.map((c) => el('th', { text: c })))),
  el('tbody', {},
    order.map((r) => el('tr', {},
      el('td', { text: r }),
      data.transitDistance.rows[r].map((v) => cell(v)))),
    // the derived supplement, visibly separated from the printed table
    Object.entries(derived.rows).map(([r, vals]) => el('tr', { class: 'derivedrow' },
      el('td', {}, r, el('span', { class: 'tag', style: 'margin-left:0.4rem', text: 'derived' })),
      vals.map((v) => cell(v, 'derived'))))));

root.append(
  el('div', { class: 'flourish' }),
  el('h2', { text: 'Transit Distance' }),
  el('p', { class: 'small muted', text: '(# of Stations + Line Transfers between Locations.) Reproduced exactly as printed — including the places where it disagrees with the Transit Map. The table is authoritative where the two differ.' }),
  el('div', { class: 'scroller panel' }, tbl),
  Object.keys(derived.rows).length
    ? el('p', { class: 'small muted' },
        el('b', { text: 'The last row is not printed. ' }), derived._note)
    : null);

mountFooter();
</script>
</body>
</html>
